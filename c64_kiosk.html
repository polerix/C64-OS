<!DOCTYPE html>
<html>

<head>
    <title>c64-os KIOSK V2</title>
    <style>
        :root {
            --bg-color: #352879;
            --fg-color: #6c5eb5;
            --border-color: #6c5eb5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--fg-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 95vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TABS */
        .tabs {
            display: flex;
            border-bottom: 4px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 30px;
            cursor: pointer;
            font-weight: bold;
            border: 2px solid transparent;
            border-bottom: none;
            font-size: 24px;
        }

        .tab.active {
            background-color: var(--fg-color);
            color: var(--bg-color);
            border-color: var(--border-color);
        }

        /* CONTENT PANELS */
        .panel {
            display: none;
            flex-grow: 1;
            overflow-y: auto;
            border: 4px solid var(--border-color);
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .panel.active {
            display: block;
        }

        /* CONTROLS */
        .section {
            border: 2px dashed var(--fg-color);
            padding: 15px;
            margin-bottom: 20px;
        }

        .section h2 {
            margin-top: 0;
            text-transform: uppercase;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            background: #000;
            color: var(--fg-color);
            border: 1px solid var(--fg-color);
            font-family: inherit;
            font-size: 18px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--fg-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 3px 3px #000;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px #000;
        }

        button.add-btn {
            background-color: #4CAF50;
            color: #fff;
        }

        /* COMMAND LIST */
        .cmd-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .cmd-inputs {
            display: flex;
            gap: 10px;
            flex-grow: 1;
        }

        .cmd-inputs input {
            width: 45%;
        }

        /* TERMINAL PREVIEW */
        .terminal-screen {
            background-color: var(--bg-color);
            /* Matches theme */
            color: var(--fg-color);
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
            font-size: 20px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('terminal')">TERMINAL VIEW</div>
        <div class="tab" onclick="switchTab('control')">CONTROL PANEL</div>
    </div>

    <!-- TERMINAL TAB -->
    <div id="terminal" class="panel active" style="padding: 0;">
        <!-- SHELLINABOX IFRAME (Port 4200) -->
        <iframe src="http://localhost:4200" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <!-- CONTROL PANEL TAB -->
    <div id="control" class="panel">

        <!-- AI CONFIGURATION -->
        <div class="section">
            <h2>AI Assistant Configuration</h2>
            <label>Select Provider:</label>
            <select id="ai-provider">
                <option value="gemini">Google Gemini 2.0 (Default)</option>
                <option value="chatgpt">OpenAI ChatGPT (Not Installed)</option>
                <option value="claude">Anthropic Claude (Not Installed)</option>
            </select>

            <label>API Key:</label>
            <input type="password" id="api-key" placeholder="Enter API Key (Hidden)">

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="key-status" style="font-size: 14px;">STATUS: KEY NOT SAVED</span>
                <button onclick="saveApiKey()">SECURE SAVE & LOCK</button>
            </div>
        </div>

        <!-- CUSTOMIZATION -->
        <div class="section">
            <h2>Visual Theme</h2>
            <div style="display: flex; gap: 10px;">
                <button onclick="setTheme('#352879', '#6c5eb5')">CLASSIC</button>
                <button onclick="setTheme('#000000', '#00FF00')">HACKER</button>
                <button onclick="setTheme('#2b2b2b', '#ff9900')">AMBER</button>
            </div>
            <label>Custom Wallpaper:</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="wa-path" placeholder="/home/pi/Pictures/wallpaper.png"
                    value="/home/pi/Pictures/commodorelogo.png">
                <button onclick="alert('File browser not implemented in demo')">BROWSE</button>
            </div>
        </div>

        <!-- COMMAND EDITOR -->
        <div class="section">
            <h2>Custom Commands Editor</h2>
            <div id="command-list">
                <!-- Commands injected here -->
            </div>
            <button class="add-btn" onclick="addCommandField()">+ ADD NEW COMMAND</button>
            <button onclick="saveCommands()">SAVE COMMANDS MAP</button>
        </div>

    </div>

    <script>
        // --- TABS LOGIC ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // --- THEME LOGIC ---
        function setTheme(bg, fg) {
            document.documentElement.style.setProperty('--bg-color', bg);
            document.documentElement.style.setProperty('--fg-color', fg);
            document.getElementById('term-screen').style.backgroundColor = bg;
            document.getElementById('term-screen').style.color = fg;

            // Save to backend
            fetch('/api/save_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bg: bg, fg: fg })
            });
        }

        // --- AI KEY SAVING ---
        function saveApiKey() {
            const provider = document.getElementById('ai-provider').value;
            const key = document.getElementById('api-key').value;

            if (!key) { alert("Please enter a key."); return; }

            fetch('/api/save_key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ provider: provider, key: key })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('api-key').value = '';
                    document.getElementById('key-status').innerText = "STATUS: *** KEY STORED ***";
                    alert("API Key Saved Securely!");
                })
                .catch(err => alert("Error saving key: " + err));
        }

        // --- COMMANDS EDITOR ---
        let commands = [
            { trig: 'LOAD', cmd: 'gemini-pi' },
            { trig: 'LIST', cmd: 'ls -la' }
        ];

        function renderCommands() {
            const container = document.getElementById('command-list');
            container.innerHTML = '';
            commands.forEach((c, idx) => {
                const div = document.createElement('div');
                div.className = 'cmd-item';
                div.innerHTML = `
                    <div class="cmd-inputs">
                        <input type="text" placeholder="TRIGGER (e.g. LOAD)" value="${c.trig}" onchange="updateCmd(${idx}, 'trig', this.value)">
                        <input type="text" placeholder="EXECUTION PATH" value="${c.cmd}" onchange="updateCmd(${idx}, 'cmd', this.value)">
                    </div>
                    <button onclick="removeCmd(${idx})" style="background: #ff4444; color: white;">X</button>
                `;
                container.appendChild(div);
            });
        }

        function addCommandField() {
            commands.push({ trig: '', cmd: '' });
            renderCommands();
        }

        function removeCmd(index) {
            commands.splice(index, 1);
            renderCommands();
        }

        function updateCmd(index, field, value) {
            commands[index][field] = value;
        }

        function saveCommands() {
            fetch('/api/save_commands', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(commands)
            })
                .then(() => alert("Command Map Saved!"))
                .catch(e => alert("Save failed: " + e));
        }

        // --- INIT ---
        // Try to load existing commands
        fetch('/api/commands').then(r => r.json()).then(data => {
            if (Array.isArray(data) && data.length > 0) {
                commands = data;
                renderCommands();
            } else {
                renderCommands(); // defaults
            }
        }).catch(() => renderCommands());

    </script>
</body>

</html>
